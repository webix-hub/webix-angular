<!DOCTYPE html>
<html lang="en" ng-app="webixApp">
<head>
  <meta charset="utf-8">
  <title>Webix - Angular  : Grid</title>
  <script src="//cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>

  <link rel="stylesheet" type="text/css" href="//cdn.webix.com/edge/webix.css">
  <script type="text/javascript" src="//cdn.webix.com/edge/webix.js"></script>
  <script type="text/javascript" src="../sources/index.js"></script>

  <script type="text/javascript" src="js/gridApp.js"></script>
  <style type="text/css">
    .rating {
      text-align: center;
    }
  </style>
</head>
<body ng-controller="webixGridController">

  <div webix-ui="config" webix-data="records" webix-watch="false" style="width:750px;"></div>
  <br>
  <button ng-click="addRecord()">Add Row</button>

</body>
</html>
